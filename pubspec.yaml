# FORK of flutter/packages video_player_android 2.12.2.
# Patches on top of upstream (used by Hana-ame/twitter-pic-flutter via
# dependency_overrides, tag 2.12.2-fallback.4):
#   1. ExoPlayer DefaultRenderersFactory.setEnableDecoderFallback(true), so a
#      hardware decoder that cannot handle the format falls back to the software
#      decoder instead of failing playback (2.12.2-fallback.1).
#   2. Runtime decoder-mode channel (auto / smart / prefer_software /
#      hardware_only) + CompatRenderersFactory, which only REORDERS the codec
#      list (never removes hardware decoders) for non-16-aligned resolutions
#      (2.12.2-fallback.2).
#   3. Playback errors carry PlaybackException errorCodeName, the real HTTP
#      status code, the failing URI and the decoder that was actually used
#      (ExoPlayerEventListener.formatPlaybackError).
#   4. MethodChannel method `openExternalVideo`: hand a proxied URL to an
#      external video player app via Intent.ACTION_VIEW, so a video the built-in
#      ExoPlayer cannot play still has an escape hatch.
name: video_player_android
description: Android implementation of the video_player plugin (fork with decoder fallback).
repository: https://github.com/Hana-ame/video_player_android
issue_tracker: https://github.com/Hana-ame/video_player_android/issues
version: 2.12.2

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

flutter:
  plugin:
    implements: video_player
    platforms:
      android:
        dartPluginClass: AndroidVideoPlayer
        package: io.flutter.plugins.videoplayer
        pluginClass: VideoPlayerPlugin

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.10.0
  video_player_platform_interface: ^6.9.0

dev_dependencies:
  build_runner: ^2.3.3
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  pigeon: ^27.3.2

topics:
  - video
  - video-player
